<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 근무 & 고양/킨텍스 행사 & 공휴일 달력</title>
    <style>
        body {
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f6f8fa;
            margin: 0;
            padding: 20px;
        }
        .calendar-container {
            background: #ffffff;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
            width: 450px;
            padding: 20px;
        }
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .calendar-header h2 {
            margin: 0;
            font-size: 1.2rem;
            color: #24292f;
        }
        .calendar-header button {
            background: #f6f8fa;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            padding: 5px 12px;
            cursor: pointer;
            font-weight: 600;
        }
        .calendar-header button:hover {
            background-color: #f3f4f6;
        }
        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 600;
            color: #57606a;
            margin-bottom: 10px;
        }
        .dates-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            row-gap: 14px;
        }
        .date-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 6px 0;
            color: #24292f;
            border-radius: 6px;
            font-weight: 500;
            min-height: 85px;
            vertical-align: top;
        }
        .date-num {
            font-size: 1rem;
            margin-bottom: 4px;
        }
        
        /* 🔴 법정 공휴일 숫자 붉은색 스타일 */
        .date-cell.public-holiday .date-num {
            color: #cf222e !important;
            font-weight: bold;
        }
        
        .shift-badge {
            font-size: 0.7rem;
            font-weight: bold;
            padding: 1px 5px;
            border-radius: 3px;
            margin-bottom: 3px;
        }
        .shift-day { background-color: #fff8c5; color: #9a6700; } /* 오전 */
        .shift-night { background-color: #f2e6ff; color: #6f30a0; } /* 오후 */
        
        /* 🔵 [수정] 휴무 뱃지 색상을 파란색 테마로 전면 변경 */
        .shift-off { background-color: #ddf4ff; color: #0969da; }

        .event-text {
            font-size: 0.55rem;
            line-height: 1.2;
            color: #ffffff;
            background-color: #57606a; /* 일반 행사는 가독성을 위해 회색으로 조정 */
            border-radius: 3px;
            padding: 1px 2px;
            width: 92%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
            text-align: center;
        }
        .event-text.concert {
            background-color: #8a3ffc; /* 콘서트는 보라색 */
        }
        .event-text.holiday-label {
            background-color: #cf222e; /* 공휴일 이름 표시는 빨간색 */
            font-weight: bold;
        }

        /* 🔵 [수정] 휴무일 칸 배경색을 부드러운 연파란색으로 변경 */
        .date-cell.off-day-bg { 
            background-color: #f0f8ff; 
        }
        /* 🔵 [수정] 휴무일 날짜 숫자 색상을 파란색으로 변경 */
        .date-cell.off-day-bg .date-num { 
            color: #0969da; 
            font-weight: bold; 
        }
        
        .date-cell.today { border: 2px solid #2da44e; box-sizing: border-box; }
        .date-cell.empty { cursor: default; }
        .info-panel {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #57606a;
            line-height: 1.6;
            border-top: 1px solid #d0d7de;
            padding-top: 12px;
        }
        .legend { display: flex; gap: 10px; margin-top: 5px; flex-wrap: wrap; }
    </style>
</head>
<body>

<div class="calendar-container">
    <div class="calendar-header">
        <button id="prevBtn">&lt;</button>
        <h2 id="monthYearTitle"></h2>
        <button id="nextBtn">&gt;</button>
    </div>
    <div class="days-grid">
        <div style="color: #cf222e;">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div style="color: #0969da;">토</div>
    </div>
    <div class="dates-grid" id="datesGrid"></div>
    
    <div class="info-panel">
        <div id="currentRuleText" style="font-weight: 600; color: #24292f; margin-bottom: 5px;">이번 달 휴무: 계산 중...</div>
        <div>💡 규칙: 3개월마다 휴무 변동 / 일주일마다 오전 오후 교대</div>
        <div class="legend">
            <span class="shift-badge shift-day">오전 오전근무</span>
            <span class="shift-badge shift-night">오후 오후근무</span>
            <span class="shift-badge shift-off">휴무 휴무일</span>
        </div>
    </div>
</div>

<script>
    const monthYearTitle = document.getElementById('monthYearTitle');
    const datesGrid = document.getElementById('datesGrid');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const currentRuleText = document.getElementById('currentRuleText');

    let currentDate = new Date();

    const BASE_YEAR = 2026; const BASE_MONTH = 7;
    const SHIFT_START_DATE = new Date(2026, 7, 6); const START_WEEK_SHIFT = 'DAY';
    const DAY_NAMES = ['일', '월', '화', '수', '목', '금', '토'];

    // 🇰🇷 대한민국 법정 공휴일 데이터
    const PUBLIC_HOLIDAYS = {
        '2026-08-15': '광복절',
        '2026-08-17': '대체공휴일(광복절)',
        '2026-09-24': '추석 연휴',
        '2026-09-25': '추석',
        '2026-09-26': '추석 연휴',
        '2026-10-03': '개천절',
        '2026-10-05': '대체공휴일(개천절)',
        '2026-10-09': '한글날',
        '2026-12-25': '성탄절'
    };

    // 🏛️ 고양시 대형 행사 일정 데이터
    const REGIONAL_EVENTS = {
        '2026-08-06': { name: '코베 베이비페어(킨텍스)', type: 'expo' },
        '2026-08-07': { name: '코베 베이비페어(킨텍스)', type: 'expo' },
        '2026-08-08': { name: '코베 베이비페어(킨텍스)', type: 'expo' },
        '2026-08-09': { name: '코베 베이비페어(킨텍스)', type: 'expo' },
        '2026-08-13': { name: '동아 가구엑스포(킨텍스)', type: 'expo' },
        '2026-08-14': { name: '동아 가구엑스포(킨텍스)', type: 'expo' },
        '2026-08-15': { name: '동아 가구엑스포(킨텍스)', type: 'expo' },
        '2026-08-16': { name: '동아 가구엑스포(킨텍스)', type: 'expo' },
        '2026-08-21': { name: '빅뱅 콘서트(종합운동장)', type: 'concert' },
        '2026-08-22': { name: '빅뱅 콘서트(종합운동장)', type: 'concert' },
        '2026-08-23': { name: '빅뱅 콘서트(종합운동장)', type: 'concert' },
        '2026-09-04': { name: '임영웅 콘서트(종합운동장)', type: 'concert' },
        '2026-09-05': { name: '임영웅 콘서트(종합운동장)', type: 'concert' },
        '2026-09-06': { name: '임영웅 콘서트(종합운동장)', type: 'concert' },
        '2026-10-02': { name: '포스트말론 공연(종합운동장)', type: 'concert' },
        '2026-10-08': { name: '더위켄드 공연(종합운동장)', type: 'concert' },
        '2026-10-11': { name: '찰리푸스 콘서트(종합운동장)', type: 'concert' },
        '2026-10-14': { name: '한국산업대전(킨텍스)', type: 'expo' },
        '2026-10-15': { name: '한국산업대전(킨텍스)', type: 'expo' },
        '2026-10-16': { name: '한국산업대전(킨텍스)', type: 'expo' }
    };

    function getOffDaysForMonth(year, month) {
        const elapsedMonths = (year - BASE_YEAR) * 12 + (month - BASE_MONTH);
        let period = elapsedMonths >= 0 ? (elapsedMonths <= 1 ? 0 : (elapsedMonths <= 4 ? 1 : 1 + Math.floor((elapsedMonths - 2) / 3))) : Math.floor(elapsedMonths / 3);
        let day1 = (2 - period) % 7; let day2 = (3 - period) % 7;
        return [day1 < 0 ? day1 + 7 : day1, day2 < 0 ? day2 + 7 : day2];
    }

    function getShiftTypeForDate(targetDate) {
        const targetThursday = new Date(targetDate);
        targetThursday.setDate(targetThursday.getDate() - (targetThursday.getDay() - 4 + 7) % 7);
        const startThursday = new Date(SHIFT_START_DATE);
        const diffWeeks = Math.round((targetThursday - startThursday.setHours(0,0,0,0)) / (1000 * 60 * 60 * 24 * 7));
        return (diffWeeks % 2 + 2) % 2 === 1 ? (START_WEEK_SHIFT === 'DAY' ? 'NIGHT' : 'DAY') : START_WEEK_SHIFT;
    }

    function renderCalendar(date) {
        const year = date.getFullYear(); const month = date.getMonth();
        monthYearTitle.textContent = `${year}년 ${month + 1}월`;

        const [offDay1, offDay2] = getOffDaysForMonth(year, month);
        currentRuleText.textContent = `📅 이 달의 휴무: 매주 [${DAY_NAMES[offDay1]}, ${DAY_NAMES[offDay2]}]요일`;
        const firstDayIndex = new Date(year, month, 1).getDay();
        const lastDate = new Date(year, month + 1, 0).getDate();

        datesGrid.innerHTML = '';
        for (let i = 0; i < firstDayIndex; i++) {
            const emptyCell = document.createElement('div'); emptyCell.classList.add('date-cell', 'empty'); datesGrid.appendChild(emptyCell);
        }

        const today = new Date();
        for (let day = 1; day <= lastDate; day++) {
            const dateCell = document.createElement('div'); dateCell.classList.add('date-cell');
            const numDiv = document.createElement('div'); numDiv.classList.add('date-num'); numDiv.textContent = day; dateCell.appendChild(numDiv);

            const thisDate = new Date(year, month, day); const currentDayOfWeek = thisDate.getDay();
            const badge = document.createElement('span'); badge.classList.add('shift-badge');

            const dateString = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;

            if (PUBLIC_HOLIDAYS[dateString]) {
                dateCell.classList.add('public-holiday');
            }

            // 1. 고정 교대 휴무일 체크
