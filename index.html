<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 교대 근무 달력</title>
    <style>
        body {
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f6f8fa;
            margin: 0;
            padding: 20px;
        }
        .calendar-container {
            background: #ffffff;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 380px;
            padding: 20px;
            box-sizing: border-box;
        }
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .calendar-header h2 {
            margin: 0;
            font-size: 1.2rem;
            color: #24292f;
        }
        .calendar-header button {
            background: #f6f8fa;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            padding: 5px 12px;
            cursor: pointer;
            font-weight: 600;
        }
        .calendar-header button:hover {
            background-color: #f3f4f6;
        }
        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 600;
            color: #57606a;
            margin-bottom: 10px;
        }
        .dates-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            row-gap: 14px;
        }
        .date-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px 0;
            color: #24292f;
            border-radius: 6px;
            font-weight: 500;
            min-height: 52px;
        }
        .date-num {
            font-size: 1rem;
            margin-bottom: 4px;
        }
        .shift-badge {
            font-size: 0.7rem;
            font-weight: bold;
            padding: 1px 5px;
            border-radius: 3px;
        }
        .shift-day { background-color: #fff8c5; color: #9a6700; } /* 오전 */
        .shift-night { background-color: #f2e6ff; color: #6f30a0; } /* 오후 */
        .shift-off { background-color: #ddf4ff; color: #0969da; } /* 휴무 */
        
        .date-cell.off-day-bg {
            background-color: #f0f8ff !important;
        }
        .date-cell.off-day-bg .date-num {
            color: #0969da !important;
            font-weight: bold;
        }
        .date-cell.today {
            border: 2px solid #2da44e;
            box-sizing: border-box;
        }
        .date-cell.empty {
            cursor: default;
        }
        .info-panel {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #57606a;
            line-height: 1.6;
            border-top: 1px solid #d0d7de;
            padding-top: 12px;
        }
        .legend {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="calendar-container">
    <div class="calendar-header">
        <button id="prevBtn">&lt;</button>
        <h2 id="monthYearTitle">근무 달력</h2>
        <button id="nextBtn">&gt;</button>
    </div>
    <div class="days-grid">
        <div style="color: #cf222e;">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div style="color: #0969da;">토</div>
    </div>
    <div class="dates-grid" id="datesGrid"></div>
    
    <div class="info-panel">
        <div id="currentRuleText" style="font-weight: 600; color: #24292f; margin-bottom: 5px;">달력을 생성하는 중...</div>
        <div>💡 규칙: 3개월마다 휴무 자동 당겨짐 / 일주일마다 오전 오후 교대</div>
        <div class="legend">
            <span class="shift-badge shift-day">오전 오전근무</span>
            <span class="shift-badge shift-night">오후 오후근무</span>
            <span class="shift-badge shift-off">휴무 휴무일</span>
        </div>
    </div>
</div>

<script>
    var monthYearTitle = document.getElementById("monthYearTitle");
    var datesGrid = document.getElementById("datesGrid");
    var prevBtn = document.getElementById("prevBtn");
    var nextBtn = document.getElementById("nextBtn");
    var currentRuleText = document.getElementById("currentRuleText");

    var currentDate = new Date();

    // 데이터 연동 기준점 고정 수치
    var BASE_YEAR = 2026;
    var BASE_MONTH = 7; 

    var DAY_NAMES = ["일", "월", "화", "수", "목", "금", "토"];

    // 3개월마다 휴무가 당겨지는 수동 매핑 데이터 (수식 버그 원천 차단)
    var MONTHLY_OFF_MAP = {
        "2026-6":, "2026-7":, "2026-8":, // 7, 8, 9월 화수 휴무
        "2026-9":, "2026-10":, "2026-11":, // 10, 11, 12월 월화 휴무
        "2026-12":, "2027-0":, "2027-1": [0, 1]   // 1, 2, 3월 일월 휴무
    };

    // 타임존 오작동이 없는 초창기 일수 계산 기반의 주야 확인 시스템
    function getSimpleShift(year, month, day) {
        if (year === 2026 && month === 7) {
            if (day >= 1 && day <= 3) return "NIGHT";
            if (day >= 6 && day <= 10) return "DAY";
        }
        
        var targetTime = new Date(year, month, day, 12, 0, 0).getTime();
        var baseTime = new Date(2026, 7, 6, 12, 0, 0).getTime();
        
        var diffDays = Math.floor((targetTime - baseTime) / (1000 * 60 * 60 * 24));
        var weekIndex = Math.floor((diffDays + 4) / 7);
        if (diffDays < -4) {
            weekIndex = Math.floor((diffDays + 4) / 7);
        }
        
        var isNightWeek = Math.abs(weekIndex % 2) === 1;
        return isNightWeek ? "NIGHT" : "DAY";
    }

    function renderCalendar(date) {
        var year = date.getFullYear();
        var month = date.getMonth();

        monthYearTitle.textContent = String(year) + "년 " + String(month + 1) + "월";

        var mapKey = String(year) + "-" + String(month);
        var currentOffDays = MONTHLY_OFF_MAP[mapKey] ||;
        
        currentRuleText.textContent = "📅 이 달의 휴무: 매주 [" + DAY_NAMES[currentOffDays[0]] + ", " + DAY_NAMES[currentOffDays[1]] + "]요일";

        var firstDayIndex = new Date(year, month, 1).getDay();
        var lastDate = new Date(year, month + 1, 0).getDate();

        datesGrid.innerHTML = "";

        for (var i = 0; i < firstDayIndex; i++) {
            var emptyCell = document.createElement("div");
            emptyCell.classList.add("date-cell", "empty");
            datesGrid.appendChild(emptyCell);
        }

        var today = new Date();

        for (var day = 1; day <= lastDate; day++) {
            var dateCell = document.createElement("div");
            dateCell.classList.add("date-cell");

            var numDiv = document.createElement("div");
            numDiv.classList.add("date-num");
            numDiv.textContent = day;
            dateCell.appendChild(numDiv);

            var currentDayOfWeek = new Date(year, month, day).getDay();
            var badge = document.createElement("span");
            badge.classList.add("shift-badge");

            if (currentDayOfWeek === currentOffDays[0] || currentDayOfWeek === currentOffDays[1]) {
                dateCell.classList.add("off-day-bg");
                badge.classList.add("shift-off");
                badge.textContent = "휴무";
            } else {
                var shiftType = getSimpleShift(year, month, day);
                if (shiftType === "DAY") {
                    badge.classList.add("shift-day");
                    badge.textContent = "오전";
                } else {
                    badge.classList.add("shift-night");
                    badge.textContent = "오후";
                }
            }
            dateCell.appendChild(badge);

            if (day === today.getDate() && month === today.getMonth() && year === today.getFullYear()) {
                dateCell.classList.add("today");
            }

            datesGrid.appendChild(dateCell);
        }
    }

    prevBtn.addEventListener("click", function() {
        currentDate.setMonth(currentDate.getMonth() - 1);
        renderCalendar(currentDate);
    });

    nextBtn.addEventListener("click", function() {
        currentDate.setMonth(currentDate.getMonth() + 1);
        renderCalendar(currentDate);
    });

    renderCalendar(currentDate);
</script>
</body>
</html>
