<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 교대 근무 달력</title>
    <style>
        body {
            font-family: '-apple-system', BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f6f8fa;
            margin: 0;
            padding: 20px;
        }
        .calendar-container {
            background: #ffffff;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.05);
            width: 380px;
            padding: 20px;
        }
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .calendar-header h2 {
            margin: 0;
            font-size: 1.2rem;
            color: #24292f;
        }
        .calendar-header button {
            background: #f6f8fa;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            padding: 5px 12px;
            cursor: pointer;
            font-weight: 600;
        }
        .calendar-header button:hover {
            background-color: #f3f4f6;
        }
        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            font-weight: 600;
            color: #57606a;
            margin-bottom: 10px;
        }
        .dates-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            text-align: center;
            row-gap: 14px;
        }
        .date-cell {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px 0;
            color: #24292f;
            border-radius: 6px;
            font-weight: 500;
            min-height: 48px;
        }
        .date-num {
            font-size: 1rem;
            margin-bottom: 4px;
        }
        .shift-badge {
            font-size: 0.7rem;
            font-weight: bold;
            padding: 1px 5px;
            border-radius: 3px;
        }
        .shift-day { background-color: #fff8c5; color: #9a6700; } /* 주간 */
        .shift-night { background-color: #f2e6ff; color: #6f30a0; } /* 야간 */
        .shift-off { background-color: #ffebe9; color: #cf222e; } /* 휴무 */

        .date-cell.off-day-bg {
            background-color: #ffebe9;
        }
        .date-cell.off-day-bg .date-num {
            color: #cf222e;
            font-weight: bold;
        }
        .date-cell.today {
            border: 2px solid #2da44e;
            box-sizing: border-box;
        }
        .date-cell.empty {
            cursor: default;
        }
        .info-panel {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #57606a;
            line-height: 1.6;
            border-top: 1px solid #d0d7de;
            padding-top: 12px;
        }
        .legend {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="calendar-container">
    <div class="calendar-header">
        <button id="prevBtn">&lt;</button>
        <h2 id="monthYearTitle"></h2>
        <button id="nextBtn">&gt;</button>
    </div>
    <div class="days-grid">
        <div style="color: #cf222e;">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div style="color: #0969da;">토</div>
    </div>
    <div class="dates-grid" id="datesGrid"></div>
    
    <div class="info-panel">
        <div id="currentRuleText" style="font-weight: 600; color: #24292f; margin-bottom: 5px;">이번 달 휴무: 계산 중...</div>
        <div>💡 규칙: 3개월마다 휴무 요일 변동 / 일주일마다 주야 교대</div>
        <div class="legend">
            <span class="shift-badge shift-day">주 주간근무</span>
            <span class="shift-badge shift-night">야 야간근무</span>
            <span class="shift-badge shift-off">휴 휴무일</span>
        </div>
    </div>
</div>

<script>
    const monthYearTitle = document.getElementById('monthYearTitle');
    const datesGrid = document.getElementById('datesGrid');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const currentRuleText = document.getElementById('currentRuleText');

    let currentDate = new Date();

    // 2026년 8월 = 화(2), 수(3) 휴무 기준점
    const BASE_YEAR = 2026;
    const BASE_MONTH = 7; // 8월

    // 기준점: 8월 6일 목요일이 속한 주기부터 정확히 맞물리도록 타겟 보정
    const SHIFT_START_DATE = new Date(2026, 7, 6);

    const DAY_NAMES = ['일', '월', '화', '수', '목', '금', '토'];

    // 3개월 로테이션 휴무 계산기 (8~9월 화수, 10~12월 월화, 1~3월 일월 완벽 대응)
    function getOffDaysForMonth(year, month) {
        const elapsedMonths = (year - BASE_YEAR) * 12 + (month - BASE_MONTH);
        let period = 0;
        
        if (elapsedMonths >= 0) {
            if (elapsedMonths <= 1) { // 8월, 9월
                period = 0; // 화, 수
            } else if (elapsedMonths <= 4) { // 10월, 11월, 12월
                period = 1; // 월, 화
            } else { // 내년 1월 이후 3개월 단위
                period = 1 + Math.floor((elapsedMonths - 2) / 3);
            }
        } else {
            period = Math.floor(elapsedMonths / 3);
        }
        
        let day1 = (2 - period) % 7;
        let day2 = (3 - period) % 7;
        if (day1 < 0) day1 += 7;
        if (day2 < 0) day2 += 7;
        
        return [day1, day2];
    }

    // [패치] 휴무가 끝나고 복귀할 때 무조건 주간/야간 스위칭이 보장되는 고정 14일 주기 알고리즘
    function getShiftTypeForDate(targetDate) {
        const start = new Date(SHIFT_START_DATE);
        start.setHours(0,0,0,0);
        
        const target = new Date(targetDate);
        target.setHours(0,0,0,0);
        
        // 두 날짜 사이의 정확한 총 일수(Days) 계산
        const diffTime = target.getTime() - start.getTime();
        const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
        
        // 1주(7일)씩 주야가 바뀌는 주기 계산 (음수 일수 예외 보정 포함)
        let cycleIdx = Math.floor(diffDays / 7);
        if (diffDays < 0) {
            cycleIdx = Math.floor(diffDays / 7);
        }
        
        // 짝수 주차 주간(DAY), 홀수 주차 야간(NIGHT) 스위칭 보장
        const isFlipped = (cycleIdx % 2 !== 0);
        return isFlipped ? 'NIGHT' : 'DAY';
    }

    function renderCalendar(date) {
        const year = date.getFullYear();
        const month = date.getMonth();

        monthYearTitle.textContent = `${year}년 ${month + 1}월`;

        const [offDay1, offDay2] = getOffDaysForMonth(year, month);
        currentRuleText.textContent = `📅 이 달의 휴무: 매주 [${DAY_NAMES[offDay1]}, ${DAY_NAMES[offDay2]}]요일`;

        const firstDayIndex = new Date(year, month, 1).getDay();
        const lastDate = new Date(year, month + 1, 0).getDate();

        datesGrid.innerHTML = '';

        for (let i = 0; i < firstDayIndex; i++) {
            const emptyCell = document.createElement('div');
            emptyCell.classList.add('date-cell', 'empty');
            datesGrid.appendChild(emptyCell);
        }

        const today = new Date();

        for (let day = 1; day <= lastDate; day++) {
            const dateCell = document.createElement('div');
            dateCell.classList.add('date-cell');
            
            const numDiv = document.createElement('div');
            numDiv.className = 'date-num';
            numDiv.textContent = day;
            dateCell.appendChild(numDiv);

            const thisDate = new Date(year, month, day);
            const currentDayOfWeek = thisDate.getDay();
            const badge = document.createElement('span');
            badge.className = 'shift-badge';

            if (year === today.getFullYear() && month === today.getMonth() && day === today.getDate()) {
                dateCell.classList.add('today');
            }

            // 1. 고정 휴무일 체크
            if (currentDayOfWeek === offDay1 || currentDayOfWeek === offDay2) {
                dateCell.classList.add('off-day-bg');
                badge.classList.add('shift-off');
                badge.textContent = '휴';
            } else {
                // 2. 패치된 14일 순환 알고리즘 적용
                const shiftType = getShiftTypeForDate(thisDate);
                if (shiftType === 'DAY') {
                    badge.classList.add('shift-day');
                    badge.textContent = '주';
                } else {
                    badge.classList.add('shift-night');
                    badge.textContent = '야';
                }
            }
            
            dateCell.appendChild(badge);
            datesGrid.appendChild(dateCell);
        }
    }

    prevBtn.addEventListener('click', () => {
        currentDate.setMonth(currentDate.getMonth() - 1);
        renderCalendar(currentDate);
    });

    nextBtn.addEventListener('click', () => {
        currentDate.setMonth(currentDate.getMonth() + 1);
        renderCalendar(currentDate);
    });

    renderCalendar(currentDate);
</script>
</body>
</html>
